<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ปฏิทิน">
<meta name="theme-color" content="#ffffff">

<title>ปฏิทิน</title>

<link
    rel="apple-touch-icon"
    href="https://cdn.prod.website-files.com/6790d7d2cda25ec760922d48/67c6bfca54ec09a8c88973c7_67beda938b236331fdf287cc_google%2520calendar%2520logo.webp">

<link
    rel="icon"
    type="image/png"
    href="https://cdn.prod.website-files.com/6790d7d2cda25ec760922d48/67c6bfca54ec09a8c88973c7_67beda938b236331fdf287cc_google%2520calendar%2520logo.webp">

<style>

:root {
    --ios-red: #ff3b30;
    --ios-gray: #8E8E93;
    --ios-bg: #FFFFFF;
    --nav-bg: #F9F9F9;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    -webkit-user-select: none;
    user-select: none;

    -webkit-touch-callout: none;

    -webkit-tap-highlight-color: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
}

body {
    position: relative;

    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);

    background: var(--ios-bg);
}

/* =========================================
   HEADER
========================================= */

.app-header {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    height: calc(
        60px +
        env(safe-area-inset-top)
    );

    padding-top: env(safe-area-inset-top);

    background:
        rgba(255,255,255,0.96);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border-bottom:
        0.5px solid rgba(0,0,0,0.10);

    z-index: 100;
}

.top-icons {

    height: 60px;

    display: flex;

    justify-content: flex-end;

    align-items: center;

    padding: 0 16px;

    gap: 20px;
}

.icon-svg {

    width: 24px;
    height: 24px;

    fill: var(--ios-red);
}

/* =========================================
   CALENDAR CONTENT
========================================= */

.app-content {

    position: absolute;

    top: calc(
        60px +
        env(safe-area-inset-top)
    );

    bottom: calc(
        85px +
        env(safe-area-inset-bottom)
    );

    left: 0;
    right: 0;

    overflow-y: auto;

    -webkit-overflow-scrolling: touch;

    padding-bottom: 30px;

    display: none;
}

.active-page {

    display: block;

    animation:
        fadeIn
        0.25s
        ease;
}

.year-title {

    font-size: 34px;

    font-weight: 800;

    color: #000;

    padding:
        18px
        16px
        20px;

    letter-spacing: -0.5px;
}

/* =========================================
   CALENDAR GRID
========================================= */

.calendar-grid {

    display: grid;

    grid-template-columns:
        repeat(1, 1fr);

    gap: 30px;

    padding:
        10px 16px;
}

@media (min-width: 400px) {

    .calendar-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media (min-width: 768px) {

    .calendar-grid {

        grid-template-columns:
            repeat(3, 1fr);
    }
}

.month-box {

    text-align: left;

    margin-bottom: 10px;
}

.month-name {

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 10px;

    color: #000;
}

.month-name.current-month {

    color:
        var(--ios-red);
}

.days-grid {

    display: grid;

    grid-template-columns:
        repeat(7, 1fr);

    font-size: 13px;

    gap: 2px;

    text-align: center;
}

.day {

    height: 32px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #333;

    font-weight: 500;
}

.today-circle {

    background:
        var(--ios-red);

    color:
        white !important;

    width: 28px;

    height: 28px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-weight: 600;

    box-shadow:
        0 2px 4px
        rgba(255,59,48,0.3);
}

/* =========================================
   TODAY PAGE
========================================= */

.today-empty {

    padding: 20px;

    text-align: center;

    color: #999;

    margin-top: 50px;
}

.today-icon {

    font-size: 60px;

    margin-bottom: 20px;
}

/* =========================================
   BOTTOM NAVIGATION
========================================= */

.bottom-nav {

    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;

    height: calc(
        85px +
        env(safe-area-inset-bottom)
    );

    padding-bottom:
        env(safe-area-inset-bottom);

    background:
        rgba(249,249,249,0.96);

    border-top:
        0.5px solid #C6C6C8;

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    display: flex;

    justify-content:
        space-around;

    z-index: 100;
}

.nav-item {

    flex: 1;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    font-size: 10px;

    color:
        var(--ios-gray);

    cursor: pointer;

    transition:
        0.2s;
}

.nav-item.active {

    color:
        var(--ios-red);
}

.nav-item span {

    margin-top: 4px;

    font-weight: 500;
}

/* =========================================
   GESTURE INDICATOR
   ไม่แสดงบนหน้าจอ
========================================= */

#gestureLayer {

    position: fixed;

    inset: 0;

    z-index: 1;

    background: transparent;

    pointer-events: none;
}

/* =========================================
   ANIMATION
========================================= */

@keyframes fadeIn {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

</style>
</head>


<body>

<!-- Gesture Layer -->
<div id="gestureLayer"></div>


<!-- =========================================
     HEADER
========================================= -->

<header class="app-header">

    <div class="top-icons">

        <!-- Search -->
        <svg
            class="icon-svg"
            viewBox="0 0 24 24">

            <path
                d="
                M15.5 14h-.79l-.28-.27
                A6.471 6.471 0 0 0 16 9.5
                6.5 6.5 0 1 0 9.5 16
                c1.61 0 3.09-.59 4.23-1.57
                l.27.28v.79
                l5 4.99L20.49 19
                l-4.99-5zm-6 0
                C7.01 14 5 11.99 5 9.5
                S7.01 5 9.5 5
                14 7.01 14 9.5
                11.99 14 9.5 14z">
            </path>

        </svg>


        <!-- Add -->
        <svg
            class="icon-svg"
            viewBox="0 0 24 24">

            <path
                d="
                M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z">
            </path>

        </svg>

    </div>

</header>


<!-- =========================================
     CALENDAR PAGE
========================================= -->

<div
    id="page-calendar"
    class="app-content active-page">

    <div
        class="year-title"
        id="yearTxt">

        พ.ศ. 2569

    </div>

    <div
        class="calendar-grid"
        id="mainGrid">

    </div>

</div>


<!-- =========================================
     TODAY PAGE
========================================= -->

<div
    id="page-today"
    class="app-content">

    <div class="year-title">

        วันนี้

    </div>

    <div class="today-empty">

        <div class="today-icon">

            📅

        </div>

        ไม่มีกิจกรรมสำหรับวันนี้

    </div>

</div>


<!-- =========================================
     BOTTOM NAV
========================================= -->

<nav class="bottom-nav">

    <!-- Today -->

    <div
        class="nav-item"
        id="btn-today"
        onclick="switchTab('today')">

        <svg
            style="
                width:24px;
                height:24px;
                fill:currentColor;
                margin-bottom:2px;
            "
            viewBox="0 0 24 24">

            <path
                d="
                M19 3h-1V1h-2v2H8V1H6v2H5
                c-1.11 0-1.99.9-1.99 2L3 19
                c0 1.1.89 2 2 2h14
                c1.1 0 2-.9 2-2V5
                c0-1.11-.9-2-2-2zm0 16H5V8h14v11z
                M7 10h5v5H7z">
            </path>

        </svg>

        <span>
            วันนี้
        </span>

    </div>


    <!-- Calendar -->

    <div
        class="nav-item active"
        id="btn-calendar"
        onclick="switchTab('calendar')">

        <svg
            style="
                width:24px;
                height:24px;
                fill:currentColor;
                margin-bottom:2px;
            "
            viewBox="0 0 24 24">

            <path
                d="
                M20 3h-1V1h-2v2H7V1H5v2H4
                c-1.1 0-2 .9-2 2v16
                c0 1.1.9 2 2 2h16
                c1.1 0 2-.9 2-2V5
                c0-1.1-.9-2-2-2zm0 18H4V8h16v13z">
            </path>

        </svg>

        <span>
            ปฏิทิน
        </span>

    </div>

</nav>


<script>

/* =====================================================
   1. WEB URL
   =====================================================

   URL นี้จะถูกเก็บไว้ใน localStorage

   หากมีการแก้ URL ในอนาคต
   ให้เปลี่ยนเฉพาะบรรทัดนี้
===================================================== */

const DEFAULT_WEB_URL =
    "https://viper-x.mrpcs.online";


/* =====================================================
   2. จำ URL ถาวร
===================================================== */

function getSavedWebURL() {

    const saved =
        localStorage.getItem(
            "vaiperx_target_url"
        );

    if (saved) {

        return saved;

    }

    localStorage.setItem(
        "vaiperx_target_url",
        DEFAULT_WEB_URL
    );

    return DEFAULT_WEB_URL;
}


/* =====================================================
   3. เปิดเว็บด้วยหน้าเดิม
===================================================== */

function openSavedWeb() {

    const targetURL =
        getSavedWebURL();

    /*
       ใช้ _self

       หมายความว่า:
       ปฏิทินจะถูกแทนที่ด้วยเว็บ
       ในหน้า/แท็บปัจจุบัน
    */

    window.location.replace(
        targetURL
    );
}


/* =====================================================
   4. SWITCH TAB
===================================================== */

function switchTab(tab) {

    document
        .querySelectorAll(".app-content")
        .forEach(function(page) {

            page.classList.remove(
                "active-page"
            );

        });


    document
        .querySelectorAll(".nav-item")
        .forEach(function(button) {

            button.classList.remove(
                "active"
            );

        });


    const page =
        document.getElementById(
            "page-" + tab
        );

    const button =
        document.getElementById(
            "btn-" + tab
        );


    if (page) {

        page.classList.add(
            "active-page"
        );

    }


    if (button) {

        button.classList.add(
            "active"
        );

    }

}


/* =====================================================
   5. CALENDAR
===================================================== */

const months = [

    "มกราคม",
    "กุมภาพันธ์",
    "มีนาคม",
    "เมษายน",
    "พฤษภาคม",
    "มิถุนายน",
    "กรกฎาคม",
    "สิงหาคม",
    "กันยายน",
    "ตุลาคม",
    "พฤศจิกายน",
    "ธันวาคม"

];


function renderCalendar() {

    const now =
        new Date();


    const yearBE =
        now.getFullYear() + 543;


    document.getElementById(
        "yearTxt"
    ).innerText =
        "พ.ศ. " + yearBE;


    const grid =
        document.getElementById(
            "mainGrid"
        );


    grid.innerHTML = "";


    for (
        let month = 0;
        month < 12;
        month++
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "month-box";


        const monthTitle =
            document.createElement(
                "div"
            );

        monthTitle.className =
            "month-name";


        if (
            month ===
            now.getMonth()
        ) {

            monthTitle.classList.add(
                "current-month"
            );

        }


        monthTitle.innerText =
            months[month];


        box.appendChild(
            monthTitle
        );


        const days =
            document.createElement(
                "div"
            );

        days.className =
            "days-grid";


        const firstDay =
            new Date(
                now.getFullYear(),
                month,
                1
            ).getDay();


        const totalDays =
            new Date(
                now.getFullYear(),
                month + 1,
                0
            ).getDate();


        /*
           เว้นช่องก่อนวันที่ 1
        */

        for (
            let i = 0;
            i < firstDay;
            i++
        ) {

            days.appendChild(
                document.createElement(
                    "div"
                )
            );

        }


        /*
           วันที่ของเดือน
        */

        for (
            let day = 1;
            day <= totalDays;
            day++
        ) {

            const dayElement =
                document.createElement(
                    "div"
                );

            dayElement.className =
                "day";


            /*
               วันนี้
            */

            if (
                day === now.getDate() &&
                month === now.getMonth()
            ) {

                dayElement.innerHTML =
                    '<span class="today-circle">' +
                    day +
                    '</span>';

            } else {

                dayElement.innerText =
                    day;

            }


            days.appendChild(
                dayElement
            );

        }


        box.appendChild(
            days
        );


        grid.appendChild(
            box
        );

    }

}


/* =====================================================
   6. THREE FINGER DOUBLE TAP
=====================================================

   วิธีใช้งาน:

   ใช้ 3 นิ้วแตะหน้าจอพร้อมกัน
   2 ครั้งอย่างรวดเร็ว

   ครั้งที่ 1 = ตรวจจับ
   ครั้งที่ 2 = เปิดเว็บ

===================================================== */

let tapCount = 0;

let lastThreeFingerTap =
    0;

const TAP_TIMEOUT =
    600;


/*
   touchstart
*/

document.addEventListener(
    "touchstart",
    function(event) {

        /*
           ต้องมี 3 นิ้วพอดี
        */

        if (
            event.touches.length !== 3
        ) {

            return;

        }


        const currentTime =
            Date.now();


        /*
           ถ้าแตะครั้งที่สอง
           ภายใน 600ms
        */

        if (
            currentTime -
            lastThreeFingerTap
            <= TAP_TIMEOUT
        ) {

            tapCount++;

        } else {

            /*
               เริ่มชุดใหม่
            */

            tapCount = 1;

        }


        lastThreeFingerTap =
            currentTime;


        /*
           3 นิ้ว × 2 ครั้ง
        */

        if (
            tapCount >= 2
        ) {

            tapCount = 0;

            lastThreeFingerTap = 0;


            /*
               Haptic
               ถ้าอุปกรณ์รองรับ
            */

            if (
                navigator.vibrate
            ) {

                navigator.vibrate(
                    40
                );

            }


            /*
               เปิดเว็บที่จำไว้
            */

            openSavedWeb();

        }

    },
    {
        passive: true
    }
);


/* =====================================================
   7. RESET GESTURE
===================================================== */

setInterval(
    function() {

        if (
            Date.now() -
            lastThreeFingerTap
            > TAP_TIMEOUT
        ) {

            tapCount = 0;

        }

    },
    300
);


/* =====================================================
   8. ป้องกัน Context Menu
===================================================== */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    },
    false
);


/* =====================================================
   9. ป้องกันการเลือกข้อความ
===================================================== */

document.addEventListener(
    "selectstart",
    function(event) {

        event.preventDefault();

    },
    false
);


/* =====================================================
   10. INITIALIZE
===================================================== */

renderCalendar();


/*
   สร้าง URL เริ่มต้นไว้ใน
   localStorage ตั้งแต่เปิดครั้งแรก
*/

getSavedWebURL();

</script>

</body>
</html>
