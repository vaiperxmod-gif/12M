<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="hosting-provider" content="Netlify">
    <meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=7309dd6f-6652-49b5-b025-50e2a4722db0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <meta name="apple-mobile-web-app-title" content="ปฏิทิน">

    <link rel="apple-touch-icon" href="https://cdn.prod.website-files.com/6790d7d2cda25ec760922d48/67c6bfca54ec09a8c88973c7_67beda938b236331fdf287cc_google%2520calendar%2520logo.webp">
    <link rel="icon" type="image/png" href="https://cdn.prod.website-files.com/6790d7d2cda25ec760922d48/67c6bfca54ec09a8c88973c7_67beda938b236331fdf287cc_google%2520calendar%2520logo.webp">

    <meta name="theme-color" content="#ffffff">
    <title>ปฏิทิน</title>

    <style>
        /* =========================================
           PART 1: GLOBAL & CALENDAR STYLES (iOS Clean)
           ========================================= */
        :root {
            --ios-red: #ff3b30;
            --ios-gray: #8E8E93;
            --ios-bg: #FFFFFF;
            --nav-bg: #F9F9F9;
            --safe-area-bottom: env(safe-area-inset-bottom);
        }

        * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--ios-bg);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* --- Calendar App Structure --- */
        .app-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 50;
            padding: 10px 16px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .top-icons { display: flex; justify-content: flex-end; gap: 20px; height: 40px; align-items: center; }
        .icon-svg { width: 24px; height: 24px; fill: var(--ios-red); cursor: pointer; }

        .app-content {
            height: calc(100vh - 120px);
            overflow-y: auto;
            display: none; /* Hidden by default */
            padding-bottom: 80px;
        }
        
        .active-page { display: block; animation: fadeIn 0.3s ease; }

        .year-title { font-size: 34px; font-weight: 800; color: #000; padding: 10px 16px 20px; letter-spacing: -0.5px; }
        
        /* Calendar Grid System */
        .calendar-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 30px; padding: 10px 16px; }
        @media (min-width: 400px) { .calendar-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 768px) { .calendar-grid { grid-template-columns: repeat(3, 1fr); } }

        .month-box { text-align: left; margin-bottom: 10px; }
        .month-name { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: #000; }
        .month-name.current-month { color: var(--ios-red); }

        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 13px; gap: 2px; text-align: center; }
        .day { height: 32px; display: flex; align-items: center; justify-content: center; color: #333; font-weight: 500; }
        
        .today-circle { 
            background: var(--ios-red); color: white !important; 
            width: 28px; height: 28px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 600; box-shadow: 0 2px 4px rgba(255, 59, 48, 0.3);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 85px;
            background: var(--nav-bg); border-top: 0.5px solid #C6C6C8;
            display: flex; justify-content: space-around; 
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 60;
            backdrop-filter: blur(20px);
        }

        .nav-item { 
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-size: 10px; color: var(--ios-gray); cursor: pointer; 
            transition: 0.2s;
        }
        .nav-item.active { color: var(--ios-red); }
        .nav-item span { margin-top: 4px; font-weight: 500; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* =========================================
           PART 2: SECRET WEB WINDOW STYLES
           ========================================= */
        .secret-panel {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 80vh;
            max-width: 600px;
            max-height: 800px;
            background-color: #080808;
            border: 2px solid #800000;
            border-radius: 12px;
            padding: 0;
            z-index: 9999;
            display: none; /* Hidden initially */
            color: #eee;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            overflow: hidden;
            flex-direction: column;
        }

        .panel-drag-header {
            background: linear-gradient(180deg, #1a0000 0%, #000 100%);
            color: #ff3333;
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 1px;
            padding: 10px 15px;
            text-align: center;
            border-bottom: 1px solid #400;
            cursor: grab;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            user-select: none;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-btn {
            color: #888;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: 0.2s;
        }
        .control-btn:hover { color: #f00; }

        .panel-iframe-container {
            flex: 1;
            width: 100%;
            height: calc(100% - 40px);
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        /* Anti-select & Drag protection */
        .no-select { user-select: none; -webkit-user-select: none; }
        img { pointer-events: none; -webkit-user-drag: none; }
    </style>
</head>
<body class="no-select">

    <div class="app-header">
        <div class="top-icons">
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
    </div>

    <div id="page-calendar" class="app-content active-page">
        <div class="year-title" id="yearTxt">2569</div>
        <div class="calendar-grid" id="mainGrid"></div>
    </div>

    <div id="page-today" class="app-content">
        <div class="year-title">วันนี้</div>
        <div style="padding: 20px; text-align: center; color: #999; margin-top: 50px;">
            <div style="font-size: 60px; margin-bottom: 20px;">📅</div>
            ไม่มีกิจกรรมสำหรับวันนี้
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" id="btn-today" onclick="switchTab('today')">
            <svg style="width:24px; height:24px; fill:currentColor; margin-bottom:2px;" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
            <span>วันนี้</span>
        </div>
        <div class="nav-item active" id="btn-calendar" onclick="switchTab('calendar')">
            <svg style="width:24px; height:24px; fill:currentColor; margin-bottom:2px;" viewBox="0 0 24 24"><path d="M20 3h-1V1h-2v2H7V1H5v2H4c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H4V8h16v13z"/></svg>
            <span>ปฏิทิน</span>
        </div>
    </nav>

    <!-- SECRET POPUP WINDOW (NULLDASH) -->
    <div class="secret-panel" id="hackPanel">
        <div class="panel-drag-header" id="panelHeader">
            <span>CLIENT SYSTEM</span>
            <div class="header-controls">
                <span class="control-btn" id="miniHack">−</span>
                <span class="control-btn" id="closeHack">×</span>
            </div>
        </div>
        
        <div class="panel-iframe-container" id="iframeContainer">
            <iframe id="webIframe" src="" title="Client NullDash"></iframe>
        </div>
    </div>

    <script>
        // --- 1. CALENDAR LOGIC ---
        const months = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        
        function switchTab(t) {
            document.querySelectorAll('.app-content').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + t).classList.add('active-page');
            document.getElementById('btn-' + t).classList.add('active');
        }

        function renderCalendar() {
            const now = new Date();
            const yearBE = now.getFullYear() + 543;
            document.getElementById('yearTxt').innerText = `พ.ศ. ${yearBE}`;
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                const box = document.createElement('div');
                box.className = 'month-box';
                const mTitle = document.createElement('div');
                mTitle.className = `month-name ${m === now.getMonth() ? 'current-month' : ''}`;
                mTitle.innerText = months[m];
                box.appendChild(mTitle);

                const days = document.createElement('div');
                days.className = 'days-grid';
                const firstDay = new Date(now.getFullYear(), m, 1).getDay();
                const totalDays = new Date(now.getFullYear(), m + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) days.appendChild(document.createElement('div'));
                for (let d = 1; d <= totalDays; d++) {
                    const dDiv = document.createElement('div');
                    dDiv.className = 'day';
                    if (d === now.getDate() && m === now.getMonth()) {
                        dDiv.innerHTML = `<span class="today-circle">${d}</span>`;
                    } else {
                        dDiv.innerText = d;
                    }
                    days.appendChild(dDiv);
                }
                box.appendChild(days);
                grid.appendChild(box);
            }
        }

        // --- 2. SECRET GESTURE (3 Fingers, 2 Taps) ---
        let touchCount = 0;
        let lastTouchTime = 0;
        const targetUrl = "https://client.nulldash.store";
        
        document.addEventListener('touchstart', (e) => {
            // ปรับแก้ตรงนี้: ตรวจจับการแตะด้วย 3 นิ้ว
            if (e.touches.length === 3) {
                const now = Date.now();
                // จับเวลาเคาะ 2 ครั้ง ระยะห่างไม่เกิน 500ms
                if (now - lastTouchTime < 500) {
                    touchCount++;
                } else {
                    touchCount = 1;
                }
                lastTouchTime = now;

                // เคาะ 2 ครั้งครบเงื่อนไข
                if (touchCount === 2) {
                    showPanel();
                    touchCount = 0;
                    if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                }
            }
        });

        function showPanel() {
            const p = document.getElementById('hackPanel');
            const iframe = document.getElementById('webIframe');
            
            // โหลดหน้าเว็บ
            iframe.src = targetUrl;
            
            p.style.display = 'flex';
            p.style.top = '50%';
            p.style.left = '50%';
            p.style.transform = 'translate(-50%, -50%)';
        }

        // --- 3. PANEL CONTROLS & DRAGGABLE LOGIC ---
        (function() {
            const panel = document.getElementById('hackPanel');
            const header = document.getElementById('panelHeader');
            const closeBtn = document.getElementById('closeHack');
            const miniBtn = document.getElementById('miniHack');
            const iframeContainer = document.getElementById('iframeContainer');
            const iframe = document.getElementById('webIframe');

            function forceClose(e) {
                if(e) e.stopPropagation();
                panel.style.display = 'none';
                iframe.src = ""; // ล้างหน้าเว็บเพื่อประหยัด RAM
                
                // คืนค่ารูปแบบย่อ
                panel.classList.remove('minimized');
                iframeContainer.style.display = 'block';
                panel.style.height = '80vh';
                miniBtn.innerHTML = "−";
            }

            function toggleMini(e) {
                if(e) e.stopPropagation();
                const isMin = panel.classList.contains('minimized');
                if (!isMin) {
                    panel.classList.add('minimized');
                    miniBtn.innerHTML = "+";
                    iframeContainer.style.display = 'none';
                    panel.style.height = 'auto';
                    panel.style.width = '240px';
                } else {
                    panel.classList.remove('minimized');
                    miniBtn.innerHTML = "−";
                    iframeContainer.style.display = 'block';
                    panel.style.height = '80vh';
                    panel.style.width = '90vw';
                }
            }

            closeBtn.onclick = forceClose;
            closeBtn.ontouchstart = forceClose;
            
            miniBtn.onclick = toggleMini;
            miniBtn.ontouchstart = toggleMini;

            // ระบบ Drag moving
            let active = false;
            let currentX, currentY, initialX, initialY;

            header.addEventListener("touchstart", dragStart, {passive: false});
            header.addEventListener("mousedown", dragStart);

            function dragStart(e) {
                if (e.target === closeBtn || e.target === miniBtn) return;

                if (e.type === "touchstart") {
                    initialX = e.touches[0].clientX - panel.offsetLeft;
                    initialY = e.touches[0].clientY - panel.offsetTop;
                } else {
                    initialX = e.clientX - panel.offsetLeft;
                    initialY = e.clientY - panel.offsetTop;
                }
                active = true;
                panel.style.transform = 'none'; 
            }

            document.addEventListener("touchmove", drag, {passive: false});
            document.addEventListener("mousemove", drag);

            function drag(e) {
                if (!active) return;
                if (e.type === "touchmove") e.preventDefault();

                currentX = (e.type === "touchmove" ? e.touches[0].clientX : e.clientX) - initialX;
                currentY = (e.type === "touchmove" ? e.touches[0].clientY : e.clientY) - initialY;

                currentX = Math.max(0, Math.min(currentX, window.innerWidth - panel.offsetWidth));
                currentY = Math.max(0, Math.min(currentY, window.innerHeight - panel.offsetHeight));

                panel.style.left = currentX + "px";
                panel.style.top = currentY + "px";
            }

            document.addEventListener("touchend", () => active = false);
            document.addEventListener("mouseup", () => active = false);
        })();

        // --- 4. SECURITY (Anti-Tamper) ---
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && (e.key === 'u' || e.key === 'c'))) e.preventDefault();
        });

        // Initialize App
        renderCalendar();
    </script>
</body>
</html>
